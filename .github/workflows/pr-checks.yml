name: Validate Mod

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# If someone pushes 3 commits rapidly, don't waste time finishing the obsolete builds for commits 1 and 2
concurrency:
  group: validate-mod-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Grab the StS2 Versions we want to validate against
  versions:
    name: Read supported StS2 versions
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read versions from project
        id: versions
        shell: bash
        run: |
          properties=$(dotnet msbuild client/StS2AP/StS2AP.csproj \
            -getProperty:Sts2PublicApiCompat,Sts2BetaApiCompat)

          public=$(echo "$properties" | jq -r '.Properties.Sts2PublicApiCompat')
          beta=$(echo "$properties" | jq -r '.Properties.Sts2BetaApiCompat')

          matrix=$(jq -cn \
            --arg public "$public" \
            --arg beta "$beta" \
            '[$public, $beta]')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          {
            echo "### 🎮 StS2 Version Targets"
            echo ""
            echo "| Branch | Version |"
            echo "| --- | --- |"
            echo "| Public | \`$public\` |"
            echo "| Beta | \`$beta\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  apworld:
    name: Validate APWorld
    uses: ./.github/workflows/build-apworld.yml
    with:
      upload_artifact: false

  client:
    name: Validate C# Client - StS2 v${{ matrix.sts2-version }}
    needs: versions

    strategy:
      fail-fast: false
      matrix:
        sts2-version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    uses: ./.github/workflows/build-client.yml
    with:
      build_mode: CompileOnly
      sts2_api_compat: ${{ matrix.sts2-version }}
