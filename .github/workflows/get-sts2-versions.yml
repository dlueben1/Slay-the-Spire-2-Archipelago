# Grabs the StS2 Versions we want to build (public and beta)
name: Get StS2 Versions

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Repository ref/SHA to read; defaults to the caller's commit"
        required: false
        type: string
        default: ""

    outputs:
      public_api:
        description: "Current supported public StS2 API version"
        value: ${{ jobs.versions.outputs.public_api }}

      beta_api:
        description: "Current supported beta StS2 API version"
        value: ${{ jobs.versions.outputs.beta_api }}

      matrix:
        description: "JSON array containing all supported StS2 API versions"
        value: ${{ jobs.versions.outputs.matrix }}

permissions:
  contents: read

jobs:
  versions:
    name: Read StS2 Versions
    runs-on: ubuntu-latest

    outputs:
      public_api: ${{ steps.read.outputs.public_api }}
      beta_api: ${{ steps.read.outputs.beta_api }}
      matrix: ${{ steps.read.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Read StS2 versions from project
        id: read
        shell: bash
        run: |
          properties=$(dotnet msbuild client/StS2AP/StS2AP.csproj \
            -getProperty:Sts2PublicApiCompat,Sts2BetaApiCompat)

          public=$(echo "$properties" | jq -r '.Properties.Sts2PublicApiCompat')
          beta=$(echo "$properties" | jq -r '.Properties.Sts2BetaApiCompat')

          matrix=$(jq -cn \
            --arg public "$public" \
            --arg beta "$beta" \
            '[$public, $beta]')

          echo "public_api=$public" >> "$GITHUB_OUTPUT"
          echo "beta_api=$beta" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          {
            echo "### 🎮 StS2 Version Targets"
            echo ""
            echo "| Target | Version |"
            echo "| --- | --- |"
            echo "| Public | \`$public\` |"
            echo "| Beta | \`$beta\` |"
          } >> "$GITHUB_STEP_SUMMARY"
