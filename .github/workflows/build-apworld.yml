name: Build APWorld

on:
  workflow_call:
    inputs:
      archipelago_ref:
        description: "Archipelago branch, tag, or commit"
        required: false
        type: string
        default: "debe4cf035c7c15efe6fb95f72343af0d420c68c" # The SHA for v0.6.7

      upload_artifact:
        description: "Upload spire2.apworld for another job to consume"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build APWorld
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out StS2 AP repository
        uses: actions/checkout@v7

      - name: Check out Archipelago
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ inputs.archipelago_ref }}
          path: external/Archipelago
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: external/Archipelago/requirements.txt

      - name: Install StS2 world into Archipelago
        shell: bash
        run: |
          rm -rf external/Archipelago/worlds/spire2
          cp -R world/spire2 external/Archipelago/worlds/spire2

      - name: Install Archipelago dependencies
        shell: bash
        working-directory: external/Archipelago
        run: |
          python -m pip install --upgrade pip
          python ModuleUpdate.py -y

      # When we eventually go to the next version after Archipelago 0.6.7, we can uncomment this
      # - name: Build APWorld
      #   shell: bash
      #   working-directory: external/Archipelago
      #   env:
      #     SKIP_REQUIREMENTS_UPDATE: "true"
      #   run: |
      #     python Launcher.py "Build APWorlds" -- "Slay the Spire II" --skip_open_folder

      - name: Build APWorld (for AP v0.6.7)
        shell: bash
        working-directory: external/Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "true"
        run: |
          python - <<'PY'
          import Launcher
          from worlds.LauncherComponents import _build_apworlds

          # Archipelago 0.6.7 always opens the output folder after building.
          # CI has no desktop, so disable that UI-only behavior.
          Launcher.open_folder = lambda *_: None

          _build_apworlds("Slay the Spire II")
          PY

      - name: Collect APWorld
        shell: bash
        run: |
          mkdir -p dist
          cp external/Archipelago/build/apworlds/spire2.apworld dist/spire2.apworld

      - name: Upload APWorld artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v6
        with:
          name: sts2-apworld
          path: dist/spire2.apworld
          if-no-files-found: error
          retention-days: 14
