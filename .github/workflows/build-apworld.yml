name: Build APWorld

on:
  workflow_call:
    inputs:
      archipelago_ref:
        description: "Archipelago branch, tag, or commit"
        required: false
        type: string
        default: "54803be064fc7e80c4628777ed0b46a9390f255f" # Archipelago 0.6.8

      upload_artifact:
        description: "Upload spire2.apworld for another job to consume"
        required: false
        type: boolean
        default: false

      source_ref:
        description: "Repository ref/SHA to build; defaults to the caller's commit"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build APWorld
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out StS2 AP repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Check out Archipelago
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ inputs.archipelago_ref }}
          path: external/Archipelago
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: external/Archipelago/requirements.txt

      - name: Install StS2 world into Archipelago
        shell: bash
        run: |
          rm -rf external/Archipelago/worlds/spire2
          cp -R world/spire2 external/Archipelago/worlds/spire2

      - name: Install Archipelago dependencies
        shell: bash
        working-directory: external/Archipelago
        run: |
          python -m pip install --upgrade pip
          python ModuleUpdate.py -y

      - name: Build APWorld
        shell: bash
        working-directory: external/Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "true"
        run: |
          python - <<'PYCODE'
          from worlds.LauncherComponents import _build_apworlds
          _build_apworlds("Slay the Spire II", "--skip_open_folder")
          PYCODE

      - name: Collect APWorld
        shell: bash
        run: |
          mkdir -p dist
          cp external/Archipelago/build/apworlds/spire2.apworld dist/spire2.apworld

      - name: Upload APWorld artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v6
        with:
          name: sts2-apworld
          path: dist/spire2.apworld
          if-no-files-found: error
          retention-days: 14
